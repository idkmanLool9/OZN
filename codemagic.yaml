# Codemagic CI/CD voor de iOS-build van Uitvaartbeheer.
# Codemagic draait op een macOS-cloud-machine; geen eigen Mac nodig.
#
# TWEE WORKFLOWS:
#   1. ios-unsigned    — bouwt een unsigned .ipa, gratis, geen Apple Developer
#                         account nodig. Voor sideloaden via AltStore op
#                         Windows + gratis Apple ID. App vervalt elke 7 dagen.
#   2. ios-testflight  — bouwt ondertekend en pusht naar TestFlight. Vereist
#                         €99/jaar Apple Developer + ASC API-key. App blijft
#                         permanent staan, geen verloop.
#
# Begin met workflow #1; schakel over op #2 zodra je het Developer-account
# hebt geactiveerd.

workflows:
  # ════════════════════════════════════════════════════════════════════════
  # Workflow 1: gratis unsigned build voor AltStore-sideload
  # ════════════════════════════════════════════════════════════════════════
  ios-unsigned:
    name: iOS — Unsigned IPA (voor AltStore)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/funeral-director-website-raXTm
          include: true
          source: true
    scripts:
      - name: npm-deps + www-map bouwen
        script: |
          npm install
          npm run build
      - name: Capacitor — iOS-platform toevoegen + sync
        script: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: CocoaPods
        script: |
          cd ios/App && pod install
      - name: Unsigned .ipa bouwen
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -derivedDataPath build \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE="" \
            build

          # Verpak .app als .ipa (zip onder Payload/ map)
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Uitvaartbeheer-unsigned.ipa Payload
          ls -lh Uitvaartbeheer-unsigned.ipa
    artifacts:
      - ios/App/Uitvaartbeheer-unsigned.ipa

  # ════════════════════════════════════════════════════════════════════════
  # Workflow 2: signed build naar TestFlight (vereist Apple Developer €99/jr)
  # ════════════════════════════════════════════════════════════════════════
  ios-testflight:
    name: iOS — TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: nl.sok.uitvaartbeheer
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APP_ID: 6786043538
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: npm-deps + www-map bouwen
        script: |
          npm install
          npm run build
      - name: Capacitor — iOS-platform toevoegen + sync
        script: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Info.plist aanvullen (export-compliance, camera, live activity)
        script: |
          PLIST=ios/App/App/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "$1" "$PLIST" 2>/dev/null; }
          # Export-compliance: voorkomt de 'gebruikt je app encryptie?'-vraag
          pb "Add :ITSAppUsesNonExemptEncryption bool false" || pb "Set :ITSAppUsesNonExemptEncryption false"
          # Camera + fotobibliotheek: VERPLICHT, anders crasht de app bij de scan
          pb "Add :NSCameraUsageDescription string 'Voor het scannen van de artsverklaring en documenten met de camera.'" \
            || pb "Set :NSCameraUsageDescription 'Voor het scannen van de artsverklaring en documenten met de camera.'"
          pb "Add :NSPhotoLibraryUsageDescription string 'Voor het kiezen van een bestaande foto van de artsverklaring of document.'" \
            || pb "Set :NSPhotoLibraryUsageDescription 'Voor het kiezen van een bestaande foto van de artsverklaring of document.'"
          pb "Add :NSPhotoLibraryAddUsageDescription string 'Voor het opslaan van gescande documenten.'" \
            || pb "Set :NSPhotoLibraryAddUsageDescription 'Voor het opslaan van gescande documenten.'"
          # Live Activities: app mag live-widgets tonen (voor latere lockscreen-widget)
          pb "Add :NSSupportsLiveActivities bool true" || pb "Set :NSSupportsLiveActivities true"
      - name: CocoaPods
        script: |
          cd ios/App && pod install
      - name: App-icon genereren uit assets/icon-only.png
        script: |
          npm run cap:assets
      - name: Versie + buildnummer
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 100))
      - name: Signed .ipa bouwen
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
