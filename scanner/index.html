<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#2563EB" />
<title>Verifi · ID-scanner</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; background: #0B1220; min-height: 100%; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overscroll-behavior: none;
  }
  #root {
    min-height: 100vh; min-height: 100dvh;
    display: block;
    background: #f0eee9;
  }

  /* Op telefoon en iPad: app vult het volledige scherm */
  .verifi-shell {
    width: 100%; max-width: none;
    min-height: 100vh; min-height: 100dvh;
    background: #f0eee9;
    position: relative; overflow: hidden;
  }
  /* Op grote desktop-schermen (>= 1100px): app-frame gecentreerd voor
     een betere browser-ervaring; iPad zelf valt hierbuiten en blijft
     dus schermvullend. */
  @media (min-width: 1100px) {
    #root {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0B1220 0%, #1E293B 100%);
      padding: 32px 16px;
    }
    .verifi-shell {
      width: 100%; max-width: 480px;
      min-height: 0;
      height: min(900px, calc(100vh - 64px));
      border-radius: 36px;
      box-shadow: 0 40px 100px rgba(15,23,42,0.5), 0 0 0 1px rgba(255,255,255,0.06);
    }
  }

  /* Animations */
  @keyframes scanPulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  @keyframes scanLine { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(220px); opacity: 0; } }
  @keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .verifi-fade-in { animation: fadeIn .25s ease both; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="config.js"></script>

<script type="text/babel" src="shared.jsx"></script>
