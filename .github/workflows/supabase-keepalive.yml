name: Supabase keepalive

# Gratis Supabase-projecten pauzeren na 1 week inactiviteit (geen API-
# requests). Deze workflow doet elke dag om 06:00 UTC twee lichte calls
# naar het project zodat het altijd actief blijft.
#
# De anon key is openbaar (zit ook in js/config.js → wordt elke pagina-
# load naar de browser gestuurd) dus mag hier rechtstreeks staan.

on:
  schedule:
    - cron: '0 6 * * *'   # elke dag 06:00 UTC
  workflow_dispatch:       # handmatig vanuit Actions-tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: https://mpuejmkhmlbkaelqbnae.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wdWVqbWtobWxia2FlbHFibmFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MjI2NzQsImV4cCI6MjA5MzA5ODY3NH0.pq6GJXqEdGNzarAw0lj8DWrtAguE3T7-MI439rlmemk
    steps:
      - name: Ping auth (wekt GoTrue)
        run: |
          curl -fsS --max-time 30 -o /dev/null \
            "$SUPABASE_URL/auth/v1/health"

      - name: Ping PostgREST (wekt de database)
        run: |
          curl -fsS --max-time 30 -o /dev/null \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/app_instellingen?select=id&limit=1"

      - name: Ping storage (wekt storage-service)
        run: |
          curl -fsS --max-time 30 -o /dev/null \
            "$SUPABASE_URL/storage/v1/object/public/kisten/dummy.txt" \
            || echo "storage 404 is ook prima — service draait dus"
